###########################################################################################################
#################################     Includes and Package Additions    ###################################
###########################################################################################################

[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include TheFilter.cfg]

[pause_resume]
[display_status]
[exclude_object]
[firmware_retraction]
[skew_correction]
[axis_twist_compensation]

[gcode_arcs]
resolution: 0.1               

[force_move]
enable_force_move: true

[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

###########################################################################################################
#########################################    Kinematics    ################################################
###########################################################################################################

[printer]
kinematics: corexy
max_velocity: 600  
max_accel: 3000    			
max_z_velocity: 30 			
max_z_accel: 350
square_corner_velocity: 5.0

###########################################################################################################
#############################################    MCUs    ##################################################
###########################################################################################################

[mcu]
canbus_uuid: 9e2b1ba81c35

[mcu EBBCan]
canbus_uuid: 5b2afb7f62b4

[mcu cartographer]
canbus_uuid: c1f1f7b50a00

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 22
verbose: no

###########################################################################################################
###################################    Temperature Monitors    ############################################
###########################################################################################################

[temperature_sensor Manta_M8P]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 85

[temperature_sensor CB1]
sensor_type: temperature_host
min_temp: 0
max_temp: 80

[temperature_sensor EBBCan]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28
min_temp: 0
max_temp: 85

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: PB0

###########################################################################################################
########################################    Input Shaper    ###############################################
###########################################################################################################

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300

[input_shaper]
shaper_type_x:mzv                  #max accel. 8,260 mm/s2    smoothing: 0.073   vibrations: 0.6%
shaper_freq_x: 53.0
damping_ratio_x: 0.092
shaper_type_y:mzv                  #max accel. 4,090 mm/s2    smoothing: 0.147   vibrations: 0.8%
shaper_freq_y: 37.4
damping_ratio_y: 0.057

###########################################################################################################
########################################    Autotune_TMC   ################################################
###########################################################################################################

[autotune_tmc stepper_x]
motor: moons-ms17hd6p4200
tuning_goal: performance

[autotune_tmc stepper_y]
motor: moons-ms17hd6p4200
tuning_goal: performance

[autotune_tmc stepper_z]
motor: moons-ms17hd6p4200
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: moons-ms17hd6p4200
tuning_goal: silent

[autotune_tmc stepper_z2]
motor: moons-ms17hd6p4200
tuning_goal: silent

[autotune_tmc stepper_z3]
motor: moons-ms17hd6p4200
tuning_goal: silent


###########################################################################################################
#######################################    X & Y Steppers    ##############################################
###########################################################################################################

## X Stepper on Motor1 (B Motor) ##

[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 120                                             # Homing Speed is very important for sensorless, do not adjust!
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: True
run_current: 0.9
diag_pin: ^PF4
driver_SGTHRS: 220                                             # Sensitivity threshold (0-255 for TMC2209) is very important for sensorless, do not adjust!

#----------------------------------------------------------------------------------------------------------#

## Y Stepper on Motor2 (A Motor) ##

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
full_steps_per_rotation:200
position_min: 0
position_endstop: 356
position_max: 356
homing_speed: 120                                             # Homing Speed is very important for sensorless, do not adjust!
homing_retract_dist: 0
homing_positive_dir: true


[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 0.9
diag_pin: ^PF3
driver_SGTHRS: 220                                            # Sensitivity threshold (0-255 for TMC2209) is very important for sensorless, do not adjust!

###########################################################################################################
#######################################      Z Steppers      ##############################################
###########################################################################################################

## Z0 Stepper - Front Left on MOTOR3_A ##

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -5
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PB9
interpolate: true
run_current: 0.8

#----------------------------------------------------------------------------------------------------------#

##	Z1 Stepper - Rear Left on Motor5 ##

[stepper_z1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PG14
interpolate: true
run_current: 0.8

#----------------------------------------------------------------------------------------------------------#

##	Z2 Stepper - Rear Right on Motor6 ##

[stepper_z2]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG10
interpolate: true
run_current: 0.8

#----------------------------------------------------------------------------------------------------------#

##	Z3 Stepper - Front Right on Motor7 ##

[stepper_z3]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PD5
interpolate: true
run_current: 0.8

###########################################################################################################
#########################################      Extruder      ##############################################
###########################################################################################################

## E0 on SB2209 ##

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 16
rotation_distance: 22.905740611
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
#control: pid
min_extrude_temp: 180
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000
max_extrude_cross_section: 7
#pid_kp: 57.369
#pid_ki: 2.533
#pid_kd: 324.854
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio27

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.65
stealthchop_threshold: 0

###########################################################################################################
#####################################      Filament Sensor     ############################################
###########################################################################################################

[filament_motion_sensor filament_sensor]
detection_length: 10.00
extruder: extruder
switch_pin: ^PC2
pause_on_runout: True 
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M117 Runout Detected!

[delayed_gcode DISABLEFILAMENTSENSOR]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0


###########################################################################################################
#######################################      Bed Heater      ##############################################
###########################################################################################################

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 1.0
min_temp: 0
max_temp: 115
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

###########################################################################################################
#######################################      Fan Control      #############################################
###########################################################################################################

[fan]
pin: EBBCan:gpio13

[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 70.0

[controller_fan controller_fan_1]
##	Hotend Fan - CNC_FAN1
pin: PF9
max_power: 1.0
kick_start_time: 0.5
fan_speed: 0.66

[heater_fan controller_fan_2]
##	Controller fan - CNC_FAN2
pin: PF6
kick_start_time: 0.5
heater: heater_bed
heater_temp: 80
fan_speed: 0.66

[controller_fan Toolhead]
pin: EBBCan:gpio6
kick_start_time: 0.5
heater: extruder
max_power: 1

###########################################################################################################
#######################################      LED Control      #############################################
###########################################################################################################

[neopixel StealthBurner]
pin: EBBCan:gpio16
chain_count: 3
color_order: GRBW
initial_RED: 0.00
initial_GREEN: 0.00
initial_BLUE: 0.00
initial_WHITE: 1.00

[output_pin Daylight_On_A_Stick]
pin: PA3
pwm:true
shutdown_value: 0
cycle_time: 0.01
value: 1.00
shutdown_value: 1.00

###########################################################################################################
########################## 	  Homing and Gantry Adjustment Routines     ###################################
###########################################################################################################

[idle_timeout]
timeout: 3300

[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
	300,25
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
zero_reference_position: 175,175
speed: 200
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 320, 320
probe_count: 30, 30
algorithm: bicubic

#----------------------------------------------------------------------------------------------------------#


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

###########################################################################################################
###############################    Homing Override (For Sensorless Homing)     ############################
###########################################################################################################

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # 1. Lift Z to clear the bed safely
  SET_KINEMATIC_POSITION Z=0
  G91
  G0 Z5 F600
  G90

  # 2. Home X Axis First (Right Frame at full 0.9A)
  {% if home_all or 'X' in params %}
    G28 X
    G0 X175 F3600  # Pull toolhead away to the center of the X gantry to prevent Y binding
  {% endif %}

  # 3. Home Y Axis Second (Rear Frame at full 0.9A)
  {% if home_all or 'Y' in params %}
    G28 Y
    G0 Y175 F3600  # Pull gantry forward to the center of the Y travel
  {% endif %}

  # 4. Home Z Axis (Cartographer Bed Center)
  {% if home_all or 'Z' in params %}
    G0 X175 Y175 F6000 
    G28 Z
    G0 Z10 F3600
  {% endif %}


###########################################################################################################
############################################## 	  Macros     ##############################################
###########################################################################################################


[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X175 Y175 Z30 F3600

#----------------------------------------------------------------------------------------------------------#
   
[gcode_macro PRINT_START]
gcode:
  {% set target_bed = params.BED|int %}                         # Target bed temperature.
  {% set target_extruder = params.EXTRUDER|int %}               # Target nozzle temperature.
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}  # Bed center X.
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}  # Bed center Y.

  M104 S150                                                     # Preheat nozzle to 150C to avoid oozing before z-offset adjustment.
  M107                                                          # Initiate fan control.
  M106 S0                                                       # Set part cooling fans to 0%.

  SET_GCODE_OFFSET Z=0                                          # Reset Z offset.
  G28                                                           # Home all axes.
  G90                                                           # Set to absolute positioning.

  SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}°C"            # Display bed heating message.
  G1 X{x_wait} Y{y_wait} Z15 F9000                              # Move to bed center.
  M190 S{target_bed}                                            # Wait for bed to reach target temperature.

  SET_DISPLAY_TEXT MSG="Tramming..."                            # Display tramming message.
  QUAD_GANTRY_LEVEL                                             # Perform Z tilt adjustment.
  G28 Z                                                         # Re-home Z after adjustment.

  SET_DISPLAY_TEXT MSG="Bed Mesh Calibration..."                # Display mesh calibration message.
  BED_MESH_CALIBRATE                                            # Perform bed mesh calibration (KAMP).

  SET_DISPLAY_TEXT MSG="Calibrating Z Offset..."                # Display Z offset calibration message.
  NOZZLE_BRUSH                                                  # Clear debris from nozzle before nozzle offset calibration.
  CARTOGRAPHER_TOUCH_HOME                                       # Calibrate Z offset.

  SET_DISPLAY_TEXT MSG="Beginning Purge Sequence..."            # Display preparation message
  SMART_PARK                                                    # Moves printhead to smart park position prior to purging.
  M109 S{target_extruder}                                       # Heat nozzle to target temperature.
  LINE_PURGE                                                    # Calls KAMP Line Purge Macro
  
  SET_DISPLAY_TEXT MSG="Control, this is Houston. We are go for launch."
#  SKEW_PROFILE LOAD=my_skew_profile	                            # Loads skew profile right before printing begins. 


#----------------------------------------------------------------------------------------------------------#

[delayed_gcode maintain_chamber_temp]
gcode:
    RESPOND MSG="Delay period reached. Turning off heaters and fans."                   # Sends text to the console/debugging log.
    M140 S0                                                                             # Turns off bed heater.
    M104 S0                                                                             # Turns off hotend heater.
    M106 S0                                                                             # Turns off part cooling fan.

#----------------------------------------------------------------------------------------------------------#  

[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 15, th.axis_maximum.z]|min %}
    {% set current_bed_target = printer.heater_bed.target %}

    SET_DISPLAY_TEXT MSG="Houston, Tranquility Base here. The Eagle has landed."
    RESPOND MSG="Keeping bed at {current_bed_target}C for the cool-down delay period."  # Sends text to the console/debugging log.
    M140 S{current_bed_target}                                                          # Locks bed temp at temp used during print. Useful for gradual cooldown and
                                                                                        # to maintain chamber temp while cycling prints.

    
    G90                                                                                 # Absolute positioning.
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                                             # Move nozzle to remove stringing.
    G0 X330 Y350 F3600                                                                  # Move toolhead to safe parking spot to avoid collisions when homing next print.
 
    M104 S150                                                                           # Sets hotend heater to idle at 150C to maintain chamber temperature.
    M106 S0                                                                             # Set part cooling fans to 0%.
    M84 X Y Z E                                                                         # Disable stepper motors to avoid overheating the motors in hot chamber.
    UPDATE_DELAYED_GCODE ID=maintain_chamber_temp DURATION=3600                         # Sets timer for 1 hour and then proceeds to shut the heaters and hotend fan off.
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    BED_MESH_CLEAR                                                                      # Clears bed mesh profile.
#    SET_SKEW CLEAR=1                                                                    # Clears skew profile.

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0                                     # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
                                                                                        # command pair is to restore the printer's coordinate system
                                                                                        # and speed settings since the commands above change them.
                                                                                        # However, to prevent any accidental, unintentional toolhead
                                                                                        # moves when restoring the state, explicitly set MOVE=0.

#----------------------------------------------------------------------------------------------------------#

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   # z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              # set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    # set hotend temp variable for reference in resume macro

        SAVE_GCODE_STATE NAME=PAUSE                                                          # save current print position for resume
        BASE_PAUSE                                                                           # pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       # check that zhop doesn't exceed z max
            G91                                                                              # relative positioning
            G1 Z{z} F900                                                                     # raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  # if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  # absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   # park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      # save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              # turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       # set timeout to 12 hours
    {% endif %}

#----------------------------------------------------------------------------------------------------------#

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          # hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  # set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        # wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     # go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          # relative positioning
        M83                                                                          # relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                # prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     # lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          # restore position
        BASE_RESUME                                                                  # resume print
    {% endif %}

#----------------------------------------------------------------------------------------------------------#

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}      # set timeout back to configured value
    CLEAR_PAUSE
    PRINT_END
    BASE_CANCEL_PRINT

#----------------------------------------------------------------------------------------------------------#

[gcode_macro M600]
gcode:
    PAUSE

#----------------------------------------------------------------------------------------------------------#

[gcode_macro PID_CALIBRATE_HOTEND]
description: Hotend Pid Calibrate
gcode:
  {% if printer.print_stats.state != "printing" %}
    PID_CALIBRATE HEATER=extruder TARGET={params.HOTEND_TEMP|default(230)}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

#----------------------------------------------------------------------------------------------------------#

[gcode_macro PID_CALIBRATE_BED]
description: Bed Pid Calibrate
gcode:
  {% if printer.print_stats.state != "printing" %}
    PID_CALIBRATE HEATER=heater_bed TARGET={params.BED_TEMP|default(65)}
  {% else %}
    RESPOND TYPE=error MSG='Not available while printing'
  {% endif %}

#----------------------------------------------------------------------------------------------------------#

[gcode_macro CENTER]
description: Defines a G-code macro for centering the toolhead.
gcode:
    G90                                                                                 # Set absolute positioning.
    G0 X170.5 Y177.5 Z30 F18000                                                         # Fast move to center position 30mm above bed.

#----------------------------------------------------------------------------------------------------------#

[gcode_macro NOZZLE_BRUSH]
description: for quick cleaning from the home screen, centers toolhead after brushing.
gcode:
   SAVE_GCODE_STATE NAME=nozzle_brush
   G90
   G1 X90 F18000
   G1 Y356 F18000
   G1 Z1 F18000
   G1 X118 F18000
   G1 X90 F18000
   G1 X118 F18000
   G1 X90 F18000
   G1 X118 F18000
   G1 X90 F18000
   G1 X118 F18000
   G1 X90 F18000
   G1 X118 F18000
   CENTER
   RESTORE_GCODE_STATE NAME=nozzle_brush

#----------------------------------------------------------------------------------------------------------#

[gcode_macro LOAD_FILAMENT]
description: Load filament and automatically heat based on material type (PLA, TPU, PETG, ABS, ASA)
gcode:
    {% set type = params.TYPE | default("ABS") | string | upper %}
    {% set purge_len = params.PURGE | default(60) | float %}
    {% set speed = params.SPEED | default(300) | float %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity | default(50) | float %}
    {% set speed_mm_per_min = [speed, (max_velocity * 60)] | min %}

    G91               ; Set to relative positioning
    G1 Z30 F1500      ; Raise Z axis 30mm at 25mm/s (1500 mm/min)
    G90               ; Restore absolute positioning

    # Define material temperature mapping
    {% if type == "PLA" %}
        {% set temp = 210 %}
    {% elif type == "PETG" or type == "TPU" %}
        {% set temp = 240 %}
    {% elif type == "ABS" or type == "ASA" %}
        {% set temp = 260 %}
    {% else %}
    
    # Fallback default if material isn't matched or recognized
        {action_respond_info("Filament type '%s' not recognized. Defaulting to 260C." % type)}
        {% set temp = 260 %}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=load_state
    
    # If currently below target, set temp and wait only until it crosses the threshold
    {% if printer.extruder.temperature < temp %}
        M117 Heating hotend to {temp}C...
        M104 S{temp}                                            # Set target temperature instantly without stalling
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}     # Begin loading the moment it gets within 2C
    {% endif %}
    
    M117 Loading {type}...
    M83                                                         # Relative extrusion mode
    G1 E45 F{speed_mm_per_min}                                  # Fast feed through CW2 gears
    G1 E15 F300                                                 # Slower feed into Dragon SF heatbreak
    G1 E{purge_len} F150                                        # Purge nozzle
    M400
    
    RESTORE_GCODE_STATE NAME=load_state
    M117 {type} Loaded!

#----------------------------------------------------------------------------------------------------------#

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament and automatically heat based on material type (PLA, ABS, PETG, PC, PA-CF)
gcode:
    {% set type = params.TYPE | default("ABS") | string | upper %}
    {% set speed = params.SPEED | default(300) | float %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity | default(50) | float %}
    {% set speed_mm_per_min = [speed, (max_velocity * 60)] | min %}
    
    {% if type == "PLA" %}
        {% set temp = 210 %}
    {% elif type == "PETG" or type == "TPU" %}
        {% set temp = 240 %}
    {% elif type == "ABS" or type == "ASA" %}
        {% set temp = 260 %}
    {% else %}
        {action_respond_info("Filament type '%s' not recognized. Defaulting to 260C." % type)}
        {% set temp = 260 %}
    {% endif %}
    
    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("Unload blocked: Printer is currently active.")}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=unload_state
    
    # If currently below target, set temp and wait only until it crosses the threshold
    {% if printer.extruder.temperature < temp %}
        M117 Heating hotend to {temp}C...
        M104 S{temp}                                              # Set target temperature instantly without stalling
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}       # Begin loading the moment it gets within 2C
    {% endif %}
    
    M117 Unloading {type}...
    M83                                                           # Relative extrusion mode
    
    # Dragon SF specific tip-shaping sequence
    G1 E5 F300                                                    # Small squeeze to condition tip
    G1 E-8 F2400                                                  # Snap-back from melt zone
    G4 P2000                                                      # Pause 2 seconds to freeze shape
    
    # Rapid clear out of Clockwork 2 gears
    G1 E-55 F{speed_mm_per_min}
    M400
    
    RESTORE_GCODE_STATE NAME=unload_state
    M117 {type} Unloaded!

